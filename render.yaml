# Render blueprint: deploy hele PåVejen med ét klik.
# https://render.com/deploy?repo=https://github.com/qvisty/PaaVejen
services:
  - type: web
    name: paavejen
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate && gunicorn config.wsgi
    envVars:
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        fromDatabase:
          name: paavejen-db
          property: connectionString

databases:
  - name: paavejen-db
    plan: free
