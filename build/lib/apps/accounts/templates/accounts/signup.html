{% extends "base.html" %}

{% block title %}Opret konto. PåVejen{% endblock %}

{% block content %}
<div class="card">
  <h2>Opret konto</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <p class="meta">Læs <a href="{% url 'terms' %}" target="_blank">vilkårene</a> før du opretter kontoen.</p>
    <button type="submit">Opret konto</button>
  </form>
</div>
{% endblock %}
