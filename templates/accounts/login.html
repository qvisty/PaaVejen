{% extends "base.html" %}

{% block title %}Log ind. PåVejen{% endblock %}

{% block content %}
<div class="card">
  <h2>Log ind</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Log ind</button>
  </form>
  <p class="meta">Har du ikke en konto? <a href="{% url 'signup' %}">Opret konto</a></p>
</div>
{% endblock %}
