{% extends "base.html" %}

{% block content %}
<div class="card">
  <h2>Annuller opgave</h2>
  <p>Er du sikker på, at du vil annullere opgaven {{ transport_request.pickup_name }} → {{ transport_request.delivery_name }}?</p>
  <form method="post">
    {% csrf_token %}
    <div class="actions">
      <button type="submit" class="button danger">Ja, annuller opgaven</button>
      <a class="button subtle" href="{{ transport_request.get_absolute_url }}">Tilbage</a>
    </div>
  </form>
</div>
{% endblock %}
