[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "paavejen"
version = "0.1.0"
description = "PåVejen: match ture med ting, der skal samme vej"
requires-python = ">=3.11"
dependencies = [
    "Django>=5.2,<6.0",
    "Pillow>=10.0",
    "whitenoise>=6.6",
]

[project.optional-dependencies]
postgres = ["dj-database-url>=2.1", "psycopg[binary]>=3.1"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["apps*", "config*"]

[tool.setuptools.package-data]
"*" = [
    "templates/*.html",
    "templates/**/*.html",
    "static/**/*.css",
]
